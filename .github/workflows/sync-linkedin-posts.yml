name: Sync LinkedIn posts to Storyblok

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkedin-storyblok-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync new company posts as Storyblok drafts
        run: node scripts/sync-linkedin-posts.mjs
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION }}
          LINKEDIN_SYNC_START_AT: ${{ vars.LINKEDIN_SYNC_START_AT }}
          STORYBLOK_MANAGEMENT_TOKEN: ${{ secrets.STORYBLOK_MANAGEMENT_TOKEN }}
          STORYBLOK_SPACE_ID: ${{ vars.STORYBLOK_SPACE_ID }}
          STORYBLOK_BLOG_FOLDER_ID: ${{ vars.STORYBLOK_BLOG_FOLDER_ID }}
